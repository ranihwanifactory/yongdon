<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>용돈 퀘스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2A6B;--sky:#5EC8F2;--sun:#FFD23F;--pink:#FF6B8B;--mint:#3DDC97;--bg:#F3F6FF;--card:#fff;--mut:#7a7fa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,.jua{font-family:Jua,"Apple SD Gothic Neo",sans-serif;font-weight:400;margin:0}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 0 var(--ink)}
.hero{background:var(--sun);text-align:center}
.hero h1{font-size:30px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:11px;border:3px solid var(--ink);border-radius:12px;margin:5px 0;background:#fff}
button{border:3px solid var(--ink);background:var(--sky);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:Jua,sans-serif;font-size:16px;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.b-go{background:var(--mint)}.b-no{background:var(--pink)}.b-ghost{background:#fff}.b-google{background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:bold}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0);z-index:9}
.tabs button{flex:1;border:0;border-radius:0;box-shadow:none;background:#fff;padding:14px 4px;font-size:15px}
.tabs button.on{background:var(--sun)}
.badge{background:var(--pink);color:#fff;border-radius:99px;padding:1px 8px;margin-left:4px;font-size:13px}
.quest{display:flex;gap:12px;align-items:center}
.ic{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border:3px solid var(--ink);border-radius:14px;flex:none}
.q-t{font-family:Jua,sans-serif;font-size:19px}.mut{color:var(--mut);font-size:13px}
.won{font-family:Jua,sans-serif;color:#d4380d}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .5s}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-size:13px;font-family:Jua,sans-serif}
.wait{background:var(--sun)}.ok{background:var(--mint)}.rej{background:var(--pink)}
.code{font-family:Jua,sans-serif;font-size:38px;letter-spacing:6px;text-align:center;background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:8px;margin:8px 0}
.link{background:none;border:0;box-shadow:none;text-decoration:underline;color:var(--mut);padding:6px}
.err{color:#c0152f;font-size:14px;min-height:18px}
.empty{text-align:center;color:var(--mut);padding:24px 6px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-family:Jua,sans-serif;display:none;z-index:99}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,onSnapshot,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDFgGnY4UR2HmBihj-uJYs33gLctaxrJ00",
  authDomain:"korpol-4eb9a.firebaseapp.com",
  projectId:"korpol-4eb9a",
  storageBucket:"korpol-4eb9a.firebasestorage.app",
  messagingSenderId:"1047092230990",
  appId:"1:1047092230990:web:257a0b31ab4da08cbd3c1f"
});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>(Number(n)||0).toLocaleString("ko-KR")+"원";
const ICONS=["🧹","📚","🛏️","🍽️","🐶","🗑️","🪥","🏃","🎹","👕","🌱","✏️"];
const TITLES=["새싹 모험가","용감한 견습생","든든한 일꾼","빛나는 기사","전설의 영웅"];

let State={me:null,kids:[],quests:[],reports:[],payouts:[],notifications:[],tab:"home",mode:"login",err:"",busy:false};
let unsubs=[];

function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}
const emailOf=v=>{v=v.trim();return v.includes("@")?v:v+"@kid.korpol.app"};
const today=()=>new Date().toDateString();

function clearData(){unsubs.forEach(u=>u());unsubs=[];State.kids=[];State.quests=[];State.reports=[];State.payouts=[];State.notifications=[];}

async function boot(user){
  clearData();
  try {
    const sn=await getDoc(doc(db,"users",user.uid));
    if(!sn.exists()){
      State.me={uid:user.uid,email:user.email||"",name:user.displayName||"사용자",role:"",createdAt:Date.now()};
      State.mode="role_select";
      render();
      return;
    }
    State.me={uid:user.uid,...sn.data()};
    State.tab="home";State.err="";
    const u=State.me.uid;

    if(State.me.role==="parent"){
      sub(query(collection(db,"users"),where("parentId","==",u)),"kids");
      sub(query(collection(db,"quests"),where("parentId","==",u)),"quests");
      sub(query(collection(db,"reports"),where("parentId","==",u)),"reports");
      sub(query(collection(db,"payouts"),where("parentId","==",u)),"payouts");
    }else if(State.me.parentId){
      sub(query(collection(db,"quests"),where("parentId","==",State.me.parentId)),"quests");
      sub(query(collection(db,"reports"),where("childId","==",u)),"reports");
      sub(query(collection(db,"payouts"),where("childId","==",u)),"payouts");
    }
    sub(query(collection(db,"notifications"),where("targetId","==",u)),"notifications");
  } catch(e) {
    State.err="데이터를 불러오지 못했어요: "+(e.message||e.code);
  }
  render();
}

function sub(q,k){
  unsubs.push(onSnapshot(q,sn=>{
    State[k]=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
    render();
  },e=>{
    console.warn("Sub error:",e.code);
  }));
}

onAuthStateChanged(auth,u=>{if(u)boot(u);else{clearData();State.me=null;render()}});

// --- 용돈 통계 계산 로직 ---
const getEarned=id=>State.reports.filter(r=>r.childId===id&&r.status==="approved").reduce((a,r)=>a+(Number(r.reward)||0),0);
const getPaid=id=>State.payouts.filter(p=>p.childId===id).reduce((a,p)=>a+(Number(p.amount)||0),0);
const getBal=id=>getEarned(id)-getPaid(id);
const getCnt=id=>State.reports.filter(r=>r.childId===id&&r.status==="approved").length;
const getLvl=id=>{const n=getCnt(id);return{lv:Math.floor(n/5)+1,pr:(n%5)/5*100,name:TITLES[Math.min(Math.floor(n/5),TITLES.length-1)]}};

// --- 인증 액션 ---
window.setMode=m=>{State.mode=m;State.err="";render()};

window.doAuth=async()=>{
  const v=id=>($("#"+id)?.value||"").trim();
  State.err="";State.busy=true;render();
  try{
    if(State.mode==="login"){
      await signInWithEmailAndPassword(auth,emailOf(v("f-id")),v("f-pw"));
    }else{
      const role=State.mode==="parent"?"parent":"child",name=v("f-name");
      if(!name)throw{code:"이름을 입력해 주세요"};
      const cr=await createUserWithEmailAndPassword(auth,emailOf(v("f-id")),v("f-pw"));
      const data={role,name,createdAt:Date.now()};
      if(role==="parent")data.code=Math.random().toString(36).slice(2,8).toUpperCase();
      await setDoc(doc(db,"users",cr.user.uid),data);
      await boot(cr.user);
    }
  }catch(e){
    State.err=({"auth/invalid-credential":"아이디 또는 비밀번호가 맞지 않아요","auth/email-already-in-use":"이미 사용 중인 아이디예요","auth/weak-password":"비밀번호는 6자 이상이어야 해요","auth/invalid-email":"아이디 형식을 확인해 주세요"})[e.code]||e.code||e.message;
  }
  State.busy=false;render();
};

window.googleLogin=async()=>{
  State.err="";State.busy=true;render();
  try{
    const provider=new GoogleAuthProvider();
    const res=await signInWithPopup(auth,provider);
    const sn=await getDoc(doc(db,"users",res.user.uid));
    if(!sn.exists()){
      State.me={uid:res.user.uid,email:res.user.email,name:res.user.displayName||"사용자",role:"",createdAt:Date.now()};
      State.mode="role_select";
    } else {
      await boot(res.user);
    }
  }catch(e){
    State.err="구글 로그인 실패: "+(e.message||e.code);
  }
  State.busy=false;render();
};

window.saveGoogleProfile=async role=>{
  const name=$("#f-gname")?.value.trim()||State.me.name;
  const data={role,name,createdAt:Date.now()};
  if(role==="parent")data.code=Math.random().toString(36).slice(2,8).toUpperCase();
  await setDoc(doc(db,"users",State.me.uid),data, {merge:true});
  toast("프로필이 설정되었어요! 환영합니다 🎉");
  await boot(auth.currentUser);
};

window.logout=()=>signOut(auth);

window.connectParent=async()=>{
  const code=$("#f-code").value.trim().toUpperCase();
  if(!code)return toast("코드를 입력해 주세요");
  const sn=await getDocs(query(collection(db,"users"),where("code","==",code)));
  const p=sn.docs.find(d=>d.data().role==="parent");
  if(!p){State.err="코드를 찾을 수 없어요. 부모님께 다시 확인해 보세요.";return render()}
  await updateDoc(doc(db,"users",State.me.uid),{parentId:p.id,parentName:p.data().name});
  toast("부모님과 연동됐어요! 🎉");
  await boot(auth.currentUser);
};

// --- 부모 기능 ---
window.addQuest=async()=>{
  const title=$("#q-t").value.trim(),reward=parseInt($("#q-r").value,10);
  const dueTime=$("#q-due")?.value.trim()||"";
  if(!title||!(reward>0)){toast("제목과 보상 금액을 입력해 주세요");return}
  const childId=$("#q-c").value;
  await addDoc(collection(db,"quests"),{parentId:State.me.uid,title,reward,icon:$("#q-i").value,childId,repeat:$("#q-p").value,dueTime,ts:Date.now()});
  
  if(childId==="all"){
    State.kids.forEach(async k=>{
      await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:k.id,title:"새 퀘스트 도착! 📋",body:`${title} (${won(reward)})`,read:false,ts:Date.now()});
    });
  }else{
    await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:childId,title:"새 퀘스트 도착! 📋",body:`${title} (${won(reward)})`,read:false,ts:Date.now()});
  }

  $("#q-t").value="";$("#q-r").value="";if($("#q-due"))$("#q-due").value="";
  toast("퀘스트를 만들고 알림을 보냈어요 ✨");
};

window.delQuest=async id=>{if(confirm("이 퀘스트를 삭제할까요?"))await deleteDoc(doc(db,"quests",id))};

window.reviewReport=async(id,status,childId,title)=>{
  await updateDoc(doc(db,"reports",id),{status,reviewedAt:Date.now()});
  await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:childId,title:status==="approved"?"퀘스트 승인 완료! ✔":"퀘스트 반려 ❌",body:`[${title}] 퀘스트가 ${status==="approved"?"승인되어 보상이 쌓였어요":"반려되었어요"}`,read:false,ts:Date.now()});
  toast(status==="approved"?"승인했어요! 보상이 쌓였어요 💰":"반려했어요");
};

window.payChild=async id=>{
  const b=getBal(id);if(b<=0){toast("지급할 금액이 없어요");return}
  const v=parseInt(prompt("지급한 금액(원)",b),10);
  if(!(v>0)||v>b){if(v>b)toast("보유 금액보다 많아요");return}
  await addDoc(collection(db,"payouts"),{parentId:State.me.uid,childId:id,amount:v,ts:Date.now()});
  await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:id,title:"용돈 지급 완료! 💰",body:`부모님이 ${won(v)}을 지급하셨어요!`,read:false,ts:Date.now()});
  toast("용돈 지급 기록을 남겼어요");
};

window.nudgeChild=async id=>{
  const msg=prompt("자녀에게 보낼 메시지 (예: 퀘스트 얼른 해라!)","숙제랑 퀘스트 잊지 마세요!");
  if(!msg)return;
  await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:id,title:"부모님의 콕! 찌르기 👈",body:msg,read:false,ts:Date.now()});
  toast("자녀에게 알림을 보냈어요!");
};

// --- 자녀 기능 ---
window.submitReport=async id=>{
  const q=State.quests.find(x=>x.id===id);if(!q)return;
  const memo=prompt("부모님께 한마디 (비워도 돼요)","")??null;if(memo===null)return;
  await addDoc(collection(db,"reports"),{parentId:State.me.parentId,childId:State.me.uid,childName:State.me.name,questId:id,title:q.title,icon:q.icon,reward:Number(q.reward),memo,status:"pending",ts:Date.now()});
  await addDoc(collection(db,"notifications"),{senderId:State.me.uid,targetId:State.me.parentId,title:"퀘스트 완료 보고! ⏳",body:`${State.me.name}님이 [${q.title}] 퀘스트를 완료했어요!`,read:false,ts:Date.now()});
  toast("보고했어요! 승인을 기다려요 ⏳");
};

window.markNotificationRead=async id=>{try{await deleteDoc(doc(db,"notifications",id))}catch(e){}};

const isQuestAvailable=q=>{
  if(q.childId!=="all"&&q.childId!==State.me.uid)return false;
  const rs=State.reports.filter(r=>r.questId===q.id&&r.status!=="rejected");
  return q.repeat==="once"?rs.length===0:!rs.some(r=>new Date(r.ts).toDateString()===today());
};

window.switchTab=k=>{State.tab=k;render()};

// --- 화면 렌더링 ---
function renderNotifications(){
  if(!State.notifications.length)return"";
  return State.notifications.map(n=>`<div class="card" style="background:var(--sun);display:flex;align-items:center;justify-content:space-between"><div><div class="q-t">🔔 ${esc(n.title)}</div><div style="font-size:14px;margin-top:2px">${esc(n.body)}</div></div><button class="b-ghost fit" onclick="markNotificationRead('${n.id}')">확인</button></div>`).join("");
}

function authView(){
  const m=State.mode,sign=m!=="login";
  if(m==="role_select"){
    return `<div class="card hero"><h1>✨ 환영합니다!</h1><p>서비스 이용을 위해 역할을 선택해주세요</p></div>
    <div class="card">
      <input id="f-gname" placeholder="이름 (예: 엄마, 민준이)" value="${esc(State.me.name||"")}">
      <div class="row" style="margin-top:10px">
        <button class="b-go" onclick="saveGoogleProfile('parent')">👨‍👩‍👧 부모로 시작</button>
        <button class="b-go" style="background:var(--sky)" onclick="saveGoogleProfile('child')">🧒 자녀로 시작</button>
      </div>
    </div>`;
  }
  return `<div class="card hero"><h1>🪙 용돈 퀘스트</h1><p style="margin:6px 0 0">할일을 해내고, 보고하고, 보상을 받아요</p></div>
  <div class="card">
    <button class="b-google" style="width:100%;margin-bottom:12px" onclick="googleLogin()"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.15 0 9.89 0 11.75s.43 3.6 1.19 5.14l4.08-2.65z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>구글 계정으로 로그인</button>
    <div style="text-align:center;color:var(--mut);margin:8px 0">- 또는 이메일 계정 -</div>
    ${sign?`<div class="row" style="margin-bottom:6px"><button class="${m==="parent"?"b-go":"b-ghost"}" onclick="setMode('parent')">👨‍👩‍👧 부모로 가입</button><button class="${m==="child"?"b-go":"b-ghost"}" onclick="setMode('child')">🧒 자녀로 가입</button></div><input id="f-name" placeholder="이름 (예: 엄마, 민준)">`:`<h2>로그인</h2>`}
    <input id="f-id" placeholder="${m==="child"?"아이디 (이메일 없어도 돼요)":"이메일 또는 아이디"}" autocomplete="username" autocapitalize="none">
    <input id="f-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="${sign?"new-password":"current-password"}" onkeydown="if(event.key==='Enter')doAuth()">
    <div class="err">${esc(State.err)}</div>
    <button class="b-go" style="width:100%" onclick="doAuth()">${sign?"가입하고 시작하기":"로그인"}</button>
    <div style="text-align:center;margin-top:8px">${sign?`<button class="link" onclick="setMode('login')">이미 계정이 있어요</button>`:`<button class="link" onclick="setMode('parent')">처음이에요, 계정 만들기</button>`}</div>
  </div>`;
}

function connectView(){
  return `<div class="card hero"><h1>🔗 부모님과 연동하기</h1></div>
  <div class="card"><p>부모님 화면의 <b>연동 코드</b> 6자리를 입력해 주세요.</p>
  <input id="f-code" maxlength="6" placeholder="ABC123" style="text-align:center;font-size:26px;letter-spacing:6px;text-transform:uppercase">
  <div class="err">${esc(State.err)}</div>
  <button class="b-go" style="width:100%" onclick="connectParent()">연동하기</button></div>
  <button class="link" onclick="logout()">로그아웃</button>`;
}

function parentView(){
  const pend=State.reports.filter(r=>r.status==="pending"),kidName=id=>State.kids.find(k=>k.id===id)?.name||"자녀";
  let h=`<div class="card hero"><h2>👨‍👩‍👧 ${esc(State.me.name)}님의 보상 본부</h2></div>${renderNotifications()}${State.err?`<div class="err">${esc(State.err)}</div>`:""}`;
  
  if(State.tab==="home"){
    h+=pend.length?pend.map(r=>`<div class="card"><div class="quest"><div class="ic">${esc(r.icon)}</div><div style="flex:1"><div class="q-t">${esc(r.title)}</div><div class="mut">${esc(r.childName)} · ${new Date(r.ts).toLocaleDateString()}${r.memo?` · “${esc(r.memo)}”`:""}</div><div class="won">+${won(r.reward)}</div></div></div>
      <div class="row" style="margin-top:10px"><button class="b-no" onclick="reviewReport('${r.id}','rejected','${r.childId}','${esc(r.title)}')">다시 해보자</button><button class="b-go" onclick="reviewReport('${r.id}','approved','${r.childId}','${esc(r.title)}')">승인하기 ✔</button></div></div>`).join(""):`<div class="empty card">승인을 기다리는 보고가 없어요 😊<br>아이가 퀘스트를 보고하면 여기에 나타나요.</div>`;
  }
  if(State.tab==="quests"){
    h+=`<div class="card"><h3>새 퀘스트 만들기</h3>
      <div class="row"><select id="q-i" class="fit" style="width:80px">${ICONS.map(i=>`<option>${i}</option>`).join("")}</select><input id="q-t" placeholder="할일 (예: 방 정리하기)"></div>
      <div class="row"><input id="q-r" type="number" min="100" step="100" placeholder="보상 (원)"><select id="q-p"><option value="daily">매일 가능</option><option value="once">한 번만</option></select></div>
      <input id="q-due" placeholder="수행/마감 시간 (예: 18:00까지, 오늘 중)">
      <select id="q-c"><option value="all">모든 자녀</option>${State.kids.map(k=>`<option value="${k.id}">${esc(k.name)}만</option>`).join("")}</select>
      <button class="b-go" style="width:100%;margin-top:6px" onclick="addQuest()">퀘스트 등록 및 알림 보내기</button></div>`;
    h+=State.quests.length?State.quests.map(q=>`<div class="card quest"><div class="ic">${esc(q.icon)}</div><div style="flex:1"><div class="q-t">${esc(q.title)}</div><div class="mut">${q.repeat==="once"?"한 번만":"매일"}${q.dueTime?` · ⏰ ${esc(q.dueTime)}`:""} · ${q.childId==="all"?"모든 자녀":esc(kidName(q.childId))}</div><div class="won">${won(q.reward)}</div></div><button class="b-ghost fit" onclick="delQuest('${q.id}')" aria-label="삭제">🗑️</button></div>`).join(""):`<div class="empty">아직 퀘스트가 없어요. 위에서 첫 퀘스트를 만들어 보세요.</div>`;
  }
  if(State.tab==="kids"){
    h+=`<div class="card"><h3>연동 코드</h3><div class="mut">자녀가 가입 후 이 코드를 입력하면 연동돼요</div><div class="code">${esc(State.me.code)}</div></div>`;
    h+=State.kids.length?State.kids.map(k=>{
      const l=getLvl(k.id);
      const bal=getBal(k.id), earned=getEarned(k.id), paid=getPaid(k.id);
      return `<div class="card"><div class="row"><h3>🧒 ${esc(k.name)}</h3><div style="text-align:right"><div class="won" style="font-size:20px">잔액: ${won(bal)}</div><div class="mut">누적: ${won(earned)} | 지급: ${won(paid)}</div></div></div>
      <div class="mut" style="margin-top:6px">Lv.${l.lv} ${l.name}</div>
      <div class="row" style="margin-top:8px"><button class="b-go" onclick="payChild('${k.id}')">용돈 지급하기</button><button class="b-ghost" onclick="nudgeChild('${k.id}')">📲 콕! 찌르기</button></div></div>`
    }).join(""):`<div class="empty card">아직 연동된 자녀가 없어요.</div>`;
  }
  return h+`<nav class="tabs"><button class="${State.tab==="home"?"on":""}" onclick="switchTab('home')">✅ 승인${pend.length?`<span class="badge">${pend.length}</span>`:""}</button><button class="${State.tab==="quests"?"on":""}" onclick="switchTab('quests')">📋 퀘스트</button><button class="${State.tab==="kids"?"on":""}" onclick="switchTab('kids')">🧒 우리 아이</button></nav><div style="text-align:center;margin:20px 0"><button class="link" onclick="logout()">로그아웃</button></div>`;
}

function childView(){
  const l=getLvl(State.me.uid), av=State.quests.filter(isQuestAvailable);
  const bal=getBal(State.me.uid), earned=getEarned(State.me.uid), paid=getPaid(State.me.uid);

  let h=`<div class="card hero">
    <div class="row">
      <div style="text-align:left">
        <h2>🧒 ${esc(State.me.name)}</h2>
        <div class="mut" style="color:var(--ink)">Lv.${l.lv} ${l.name}</div>
      </div>
      <div style="text-align:right">
        <div class="won" style="font-size:22px">잔액: ${won(bal)}</div>
        <div class="mut" style="font-size:12px;color:var(--ink);margin-top:2px">누적획득: ${won(earned)}</div>
        <div class="mut" style="font-size:12px;color:var(--ink)">받은용돈: ${won(paid)}</div>
      </div>
    </div>
    <div class="bar" style="margin-top:8px" title="다음 레벨까지"><i style="width:${l.pr}%"></i></div>
  </div>${renderNotifications()}${State.err?`<div class="err">${esc(State.err)}</div>`:""}`;
  
  if(State.tab==="home"){
    h+=av.length?av.map(q=>`<div class="card quest"><div class="ic">${esc(q.icon)}</div><div style="flex:1"><div class="q-t">${esc(q.title)}</div>${q.dueTime?`<div class="mut" style="color:#d4380d">⏰ ${esc(q.dueTime)}</div>`:""}<div class="won">+${won(q.reward)}</div></div><button class="b-go fit" onclick="submitReport('${q.id}')">했어요!</button></div>`).join(""):`<div class="empty card">${State.quests.length?"오늘 할 수 있는 퀘스트를 모두 끝냈어요 🎉":"부모님이 퀘스트를 만들면 여기에 나타나요."}</div>`;
  }
  if(State.tab==="log"){
    h+=State.reports.length?State.reports.map(r=>`<div class="card quest"><div class="ic">${esc(r.icon)}</div><div style="flex:1"><div class="q-t">${esc(r.title)}</div><div class="mut">${new Date(r.ts).toLocaleDateString()} · ${won(r.reward)}</div></div>${r.status==="pending"?'<span class="pill wait">대기중</span>':r.status==="approved"?'<span class="pill ok">승인</span>':'<span class="pill rej">반려</span>'}</div>`).join(""):`<div class="empty card">아직 보고한 기록이 없어요.</div>`;
    if(State.payouts.length)h+=`<h3 style="margin-top:18px">받은 용돈</h3>`+State.payouts.map(p=>`<div class="card row"><span>${new Date(p.ts).toLocaleDateString()}</span><span class="won" style="text-align:right">${won(p.amount)}</span></div>`).join("");
  }
  return h+`<nav class="tabs"><button class="${State.tab==="home"?"on":""}" onclick="switchTab('home')">⚔️ 퀘스트${av.length?`<span class="badge">${av.length}</span>`:""}</button><button class="${State.tab==="log"?"on":""}" onclick="switchTab('log')">📜 내 기록</button></nav><div style="text-align:center;margin:20px 0"><button class="link" onclick="logout()">로그아웃</button></div>`;
}

function render(){
  const a=$("#app");if(!a)return;
  if(!State.me)a.innerHTML=authView();
  else if(State.me.role==="parent")a.innerHTML=parentView();
  else a.innerHTML=State.me.parentId?childView():connectView();
}
render();
</script>
</body>
</html>
