<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>용돈 퀘스트 - 재미있는 부모 자녀 용돈 관리</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Canvas Confetti for Gameful Celebrations -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --primary-ink: #2B2A6B;
  --sky-blue: #4A90E2;
  --sky-light: #EBF3FF;
  --sun-yellow: #FFD23F;
  --coral-pink: #FF6B8B;
  --mint-green: #2ECC71;
  --purple-accent: #8E44AD;
  --bg-color: #F4F7FC;
  --card-bg: #FFFFFF;
  --text-muted: #7F8C8D;
  --border-color: #2B2A6B;
  --shadow-color: rgba(43, 42, 107, 0.15);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--primary-ink);
  font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  padding-bottom: calc(75px + env(safe-area-inset-bottom));
  user-select: none;
}

h1, h2, h3, h4, .font-jua {
  font-family: 'Jua', sans-serif;
  font-weight: 400;
  margin: 0;
}

#app {
  max-width: 500px;
  margin: 0 auto;
  padding: 16px 16px 20px;
  min-height: 100vh;
}

/* Card Styling */
.card {
  background: var(--card-bg);
  border: 3px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 6px 0 var(--border-color);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  position: relative;
  overflow: hidden;
}

.card-hero {
  background: linear-gradient(135deg, #FFD23F 0%, #FFB703 100%);
  text-align: center;
  padding: 20px 16px;
}

/* Form Elements */
input, select, textarea, button {
  font-family: inherit;
  color: var(--primary-ink);
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  margin: 6px 0 12px;
  background: #FFF;
  font-size: 15px;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--sky-blue);
  box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
}

button {
  border: 3px solid var(--border-color);
  background: var(--sky-blue);
  color: #FFF;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  cursor: pointer;
  font-family: 'Jua', sans-serif;
  font-size: 17px;
  box-shadow: 0 4px 0 var(--border-color);
  transition: all 0.1s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--border-color);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: 0 4px 0 var(--border-color);
}

.btn-mint { background: var(--mint-green); }
.btn-pink { background: var(--coral-pink); }
.btn-yellow { background: var(--sun-yellow); color: var(--primary-ink); text-shadow: none; }
.btn-ghost { background: #FFFFFF; color: var(--primary-ink); text-shadow: none; }
.btn-google { 
  background: #FFFFFF; 
  color: #444; 
  text-shadow: none; 
  border: 3px solid var(--border-color);
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

/* Helper Flex & Grid */
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.row > .fit { flex: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Tabs Bar */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: #FFF;
  border-top: 3px solid var(--border-color);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
  max-width: 500px;
  margin: 0 auto;
}

.tabs button {
  flex: 1;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: #FFF;
  color: var(--text-muted);
  padding: 10px 4px;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-shadow: none;
}

.tabs button.on {
  background: var(--sky-light);
  color: var(--primary-ink);
  font-weight: bold;
}

.tabs button .icon { font-size: 20px; }

.badge {
  background: var(--coral-pink);
  color: #FFF;
  border-radius: 99px;
  padding: 2px 7px;
  font-size: 11px;
  font-weight: bold;
  margin-left: 2px;
}

/* Gamification & Quests */
.quest-item {
  display: flex;
  gap: 12px;
  align-items: center;
}

.quest-icon {
  font-size: 32px;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  background: var(--sky-light);
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}

.quest-title { font-family: 'Jua', sans-serif; font-size: 19px; line-height: 1.2; }
.text-muted { color: var(--text-muted); font-size: 13px; }
.amount-won { font-family: 'Jua', sans-serif; color: #E67E22; font-size: 17px; }

/* Progress Bar */
.progress-bar {
  height: 18px;
  border: 3px solid var(--border-color);
  border-radius: 99px;
  background: #FFF;
  overflow: hidden;
  position: relative;
}

.progress-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mint-green), #27AE60);
  transition: width 0.5s ease-in-out;
}

/* Status Pills */
.pill {
  display: inline-block;
  border: 2px solid var(--border-color);
  border-radius: 99px;
  padding: 2px 10px;
  font-size: 12px;
  font-family: 'Jua', sans-serif;
}
.pill-pending { background: var(--sun-yellow); }
.pill-approved { background: var(--mint-green); color: #FFF; }
.pill-rejected { background: var(--coral-pink); color: #FFF; }

.invite-code-box {
  font-family: 'Jua', sans-serif;
  font-size: 36px;
  letter-spacing: 6px;
  text-align: center;
  background: var(--sky-light);
  border: 3px dashed var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px;
  margin: 10px 0;
  color: var(--primary-ink);
}

/* Modal Overlay */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  backdrop-filter: blur(3px);
}

.modal-content {
  background: #FFF;
  border: 3px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary-ink);
  color: #FFF;
  padding: 12px 24px;
  border-radius: 99px;
  font-family: 'Jua', sans-serif;
  font-size: 16px;
  display: none;
  z-index: 2000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 90%;
  border: 2px solid #FFF;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 30px 10px;
  font-size: 15px;
}

.link-btn {
  background: none;
  border: none;
  box-shadow: none;
  color: var(--text-muted);
  text-decoration: underline;
  padding: 6px;
  font-size: 14px;
  cursor: pointer;
}

.err-msg {
  color: #E74C3C;
  font-size: 13px;
  margin: 4px 0 8px;
  font-weight: 500;
  min-height: 18px;
}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<!-- Firebase SDK Module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, 
  GoogleAuthProvider, signInWithPopup 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, onSnapshot, getDocs 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase App Config
const firebaseConfig = {
  apiKey: "AIzaSyDFgGnY4UR2HmBihj-uJYs33gLctaxrJ00",
  authDomain: "korpol-4eb9a.firebaseapp.com",
  projectId: "korpol-4eb9a",
  storageBucket: "korpol-4eb9a.firebasestorage.app",
  messagingSenderId: "1047092230990",
  appId: "1:1047092230990:web:257a0b31ab4da08cbd3c1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

// DOM Selector Helper
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => (Number(n) || 0).toLocaleString("ko-KR") + "원";

// Game Assets & Levels Definition
const ICONS = ["🧹", "📚", "🛏️", "🍽️", "🐶", "🗑️", "🪥", "🏃", "🎹", "👕", "🌱", "✏️", "🧼", "🎒"];
const LEVEL_TITLES = [
  "새싹 모험가 🌱", "용감한 견습생 🛡️", "든든한 일꾼 🛠️", 
  "빛나는 기사 ⚔️", "전설의 영웅 👑", "용돈의 마스터 💎"
];

// App Central State
let State = {
  me: null,
  authUser: null,
  kids: [],
  quests: [],
  reports: [],
  payouts: [],
  tab: "home",
  authMode: "login", // 'login', 'signup', 'setup_profile'
  authRole: "parent", // 'parent', 'child'
  err: "",
  busy: false,
  modal: null, // modal state
  notifications: [] // 실시간 알림 데이터
};

let unsubs = [];
let signing = false;

// Toast System
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.style.display = "none", 2500);
}

// Confetti Effect
function triggerConfetti() {
  if (typeof confetti === 'function') {
    confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
  }
}

// Helper formatting
const formatPhone = num => (num || '').replace(/[^0-9]/g, '').replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, `$1-$2-$3`);
const todayStr = () => new Date().toDateString();
const emailOf = v => { v = v.trim(); return v.includes("@") ? v : v + "@kid.korpol.app"; };

// Firestore Realtime Subscriptions Manager
function clearSubscribers() {
  unsubs.forEach(unsub => unsub());
  unsubs = [];
  State.kids = []; State.quests = []; State.reports = []; State.payouts = [];
}

function subscribeData() {
  clearSubscribers();
  if (!State.me) return;

  const uid = State.me.uid;
  if (State.me.role === "parent") {
    // Parent Data Streams
    unsubs.push(onSnapshot(query(collection(db, "users"), where("parentId", "==", uid)), sn => {
      State.kids = sn.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db, "quests"), where("parentId", "==", uid)), sn => {
      State.quests = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db, "reports"), where("parentId", "==", uid)), sn => {
      State.reports = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db, "payouts"), where("parentId", "==", uid)), sn => {
      State.payouts = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
  } else if (State.me.parentId) {
    // Child Data Streams
    unsubs.push(onSnapshot(query(collection(db, "quests"), where("parentId", "==", State.me.parentId)), sn => {
      State.quests = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db, "reports"), where("childId", "==", uid)), sn => {
      State.reports = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db, "payouts"), where("childId", "==", uid)), sn => {
      State.payouts = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
      render();
    }));
  }

  // 내 수신 알림 실시간 구독 (부모/자녀 공통)
  unsubs.push(onSnapshot(query(collection(db, "notifications"), where("targetId", "==", uid)), sn => {
    State.notifications = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.ts||0) - (a.ts||0));
    render();
  }));
}

// App Initialization Bootstrapping
async function boot(user) {
  clearSubscribers();
  State.authUser = user;

  try {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (!userDoc.exists()) {
      State.me = null;
      State.authMode = "setup_profile";
      render();
      return;
    }

    State.me = { uid: user.uid, ...userDoc.data() };
    State.authMode = "logged_in";
    subscribeData();
    render();
  } catch (err) {
    console.error("Boot error:", err);
    State.err = "사용자 정보를 불러오는 중 오류가 발생했습니다.";
    render();
  }
}

// Firebase Auth Observer
onAuthStateChanged(auth, user => {
  if (signing) return;
  if (user) {
    boot(user);
  } else {
    clearSubscribers();
    State.me = null;
    State.authUser = null;
    State.authMode = "login";
    render();
  }
});

// Gamification Calculations
const getEarned = childId => State.reports.filter(r => r.childId === childId && r.status === "approved").reduce((sum, r) => sum + (r.reward || 0), 0);
const getPaid = childId => State.payouts.filter(p => p.childId === childId).reduce((sum, p) => sum + (p.amount || 0), 0);
const getBalance = childId => getEarned(childId) - getPaid(childId);
const getApprovedCount = childId => State.reports.filter(r => r.childId === childId && r.status === "approved").length;
const getLevelInfo = childId => {
  const cnt = getApprovedCount(childId);
  const lv = Math.floor(cnt / 5) + 1;
  const progress = ((cnt % 5) / 5) * 100;
  const titleIdx = Math.min(lv - 1, LEVEL_TITLES.length - 1);
  return { lv, progress, title: LEVEL_TITLES[titleIdx], count: cnt };
};

// --- AUTHENTICATION ACTIONS ---
window.handleGoogleLogin = async () => {
  State.err = "";
  try {
    signing = true;
    const res = await signInWithPopup(auth, googleProvider);
    signing = false;
    await boot(res.user);
  } catch (err) {
    signing = false;
    console.error(err);
    State.err = "구글 로그인에 실패했습니다. (" + err.message + ")";
    render();
  }
};

window.handleEmailAuth = async () => {
  const getV = id => ($("#" + id)?.value || "").trim();
  State.err = "";
  State.busy = true;
  render();

  try {
    if (State.authMode === "login") {
      const email = emailOf(getV("f-id"));
      const pw = getV("f-pw");
      if (!email || !pw) throw new Error("아이디와 비밀번호를 입력해 주세요.");
      await signInWithEmailAndPassword(auth, email, pw);
    } else if (State.authMode === "signup") {
      const name = getV("f-name");
      const email = emailOf(getV("f-id"));
      const pw = getV("f-pw");
      const phone = getV("f-phone");

      if (!name) throw new Error("이름을 입력해 주세요.");
      if (!pw || pw.length < 6) throw new Error("비밀번호는 6자리 이상이어야 합니다.");

      signing = true;
      const userCred = await createUserWithEmailAndPassword(auth, email, pw);
      const role = State.authRole;
      const data = {
        role,
        name,
        email: userCred.user.email,
        phone: formatPhone(phone),
        createdAt: Date.now()
      };
      if (role === "parent") {
        data.code = Math.random().toString(36).slice(2, 8).toUpperCase();
      }
      await setDoc(doc(db, "users", userCred.user.uid), data);
      signing = false;
      await boot(userCred.user);
    }
  } catch (e) {
    signing = false;
    const msgMap = {
      "auth/invalid-credential": "아이디 또는 비밀번호가 올바르지 않습니다.",
      "auth/email-already-in-use": "이미 가입되어 있는 아이디/이메일입니다.",
      "auth/weak-password": "비밀번호는 최소 6자 이상이어야 합니다.",
      "auth/invalid-email": "이메일 형식이 올바르지 않습니다."
    };
    State.err = msgMap[e.code] || e.message || "인증 오류가 발생했습니다.";
  }
  State.busy = false;
  render();
};

window.handleSetupProfile = async () => {
  const getV = id => ($("#" + id)?.value || "").trim();
  const name = getV("p-name");
  const phone = getV("p-phone");
  const role = $("input[name='p-role']:checked")?.value || "parent";

  if (!name) { State.err = "이름을 입력해 주세요."; render(); return; }

  State.busy = true;
  render();

  try {
    const data = {
      role,
      name,
      email: State.authUser.email || '',
      phone: formatPhone(phone),
      createdAt: Date.now()
    };
    if (role === "parent") {
      data.code = Math.random().toString(36).slice(2, 8).toUpperCase();
    }
    await setDoc(doc(db, "users", State.authUser.uid), data);
    await boot(State.authUser);
  } catch (err) {
    State.err = "프로필 저장 실패: " + err.message;
  }
  State.busy = false;
  render();
};

window.logout = () => {
  signOut(auth);
};

// --- LINKING ACCOUNTS (부모 - 자녀 연동) ---
window.linkParentByCode = async () => {
  const code = ($("#f-link-code")?.value || "").trim().toUpperCase();
  if (!code) { toast("초대 코드를 입력해 주세요"); return; }

  try {
    const sn = await getDocs(query(collection(db, "users"), where("code", "==", code)));
    const parentDoc = sn.docs.find(d => d.data().role === "parent");
    if (!parentDoc) {
      State.err = "유효한 부모님의 코드를 찾을 수 없습니다.";
      render();
      return;
    }
    await updateDoc(doc(db, "users", State.me.uid), {
      parentId: parentDoc.id,
      parentName: parentDoc.data().name,
      parentEmail: parentDoc.data().email || '',
      parentPhone: parentDoc.data().phone || ''
    });
    toast("부모님과 성공적으로 연동되었습니다! 🎉");
    triggerConfetti();
    await boot(auth.currentUser);
  } catch (e) {
    toast("연동 오류: " + e.message);
  }
};

window.linkParentByContact = async () => {
  const searchVal = ($("#f-link-contact")?.value || "").trim();
  if (!searchVal) { toast("이메일 또는 연락처를 입력해 주세요"); return; }

  try {
    let qEmail = query(collection(db, "users"), where("role", "==", "parent"), where("email", "==", searchVal));
    let sn = await getDocs(qEmail);

    if (sn.empty) {
      let qPhone = query(collection(db, "users"), where("role", "==", "parent"), where("phone", "==", formatPhone(searchVal)));
      sn = await getDocs(qPhone);
    }

    if (sn.empty) {
      State.err = "해당 이메일/연락처의 부모 계정을 찾을 수 없습니다.";
      render();
      return;
    }

    const parentDoc = sn.docs[0];
    await updateDoc(doc(db, "users", State.me.uid), {
      parentId: parentDoc.id,
      parentName: parentDoc.data().name,
      parentEmail: parentDoc.data().email || '',
      parentPhone: parentDoc.data().phone || ''
    });

// --- QUEST & PAYOUT & NOTIFICATION ACTIONS ---
window.addQuest = async () => {
  const title = ($("#q-title")?.value || "").trim();
  const reward = parseInt($("#q-reward")?.value, 10);
  const icon = $("#q-icon")?.value || "🧹";
  const childId = $("#q-child")?.value || "all";
  const repeat = $("#q-repeat")?.value || "daily";
  const dueTime = ($("#q-duetime")?.value || "").trim();

  if (!title || isNaN(reward) || reward <= 0) {
    toast("퀘스트 제목과 유효한 보상 금액을 입력해 주세요.");
    return;
  }

  const newQuest = {
    parentId: State.me.uid,
    title, reward, icon, childId, repeat, dueTime,
    ts: Date.now()
  };

  await addDoc(collection(db, "quests"), newQuest);

  // 대상 자녀들에게 사전 알림 메시지 발송
  const targetKids = childId === "all" ? State.kids : State.kids.filter(k => k.id === childId);
  for (const kid of targetKids) {
    await addDoc(collection(db, "notifications"), {
      targetId: kid.id,
      senderName: State.me.name,
      type: "new_quest",
      title: `✨ 새로운 퀘스트 등록!`,
      message: `"${title}" 퀘스트가 등록되었어요.${dueTime ? ` (시간: ${dueTime})` : ''}`,
      ts: Date.now(),
      read: false
    });
  }

  if ($("#q-title")) $("#q-title").value = "";
  if ($("#q-reward")) $("#q-reward").value = "";
  if ($("#q-duetime")) $("#q-duetime").value = "";
  toast("새 퀘스트 등록 및 자녀 알림 발송 완료! ✨");
};

// 부모가 자녀에게 직접 알림/콕 찌르기 메시지 보내기
window.sendDirectNotification = async (targetChildId) => {
  const child = State.kids.find(k => k.id === targetChildId);
  const msg = prompt(`${child ? child.name : '자녀'}에게 보낼 알림 메시지를 입력하세요:`, "오늘 할일 퀘스트 잊지 말고 해보자! 🔥");
  if (!msg || !msg.trim()) return;

  await addDoc(collection(db, "notifications"), {
    targetId: targetChildId,
    senderName: State.me.name,
    type: "poke",
    title: `👉 ${State.me.name} 부모님의 콕! 찌르기 알림`,
    message: msg.trim(),
    ts: Date.now(),
    read: false
  });

  toast("자녀에게 direct 알림을 보냈습니다! 📲");
};

window.markNotificationRead = async (id) => {
  await updateDoc(doc(db, "notifications", id), { read: true });
};

window.deleteQuest = async (id) => {
  if (confirm("이 퀘스트를 삭제할까요?")) {
    await deleteDoc(doc(db, "quests", id));
    toast("퀘스트가 삭제되었습니다.");
  }
};

window.submitQuestReport = async (questId) => {
  const quest = State.quests.find(q => q.id === questId);
  if (!quest) return;

  const memo = prompt("부모님께 전달할 완료 한마디 (선택사항):", "") ?? null;
  if (memo === null) return; // Cancelled

  await addDoc(collection(db, "reports"), {
    parentId: State.me.parentId,
    childId: State.me.uid,
    childName: State.me.name,
    questId: quest.id,
    title: quest.title,
    icon: quest.icon,
    reward: quest.reward,
    memo: memo.trim(),
    status: "pending",
    ts: Date.now()
  });

  // 부모님에게 완료 보고 알림 전송
  await addDoc(collection(db, "notifications"), {
    targetId: State.me.parentId,
    senderName: State.me.name,
    type: "report_submitted",
    title: `🖐️ ${State.me.name} 자녀의 퀘스트 완료 보고!`,
    message: `"${quest.title}" 퀘스트를 수행했어요. 승인을 확인해 주세요.${memo.trim() ? ` (메시지: ${memo.trim()})` : ''}`,
    ts: Date.now(),
    read: false
  });

  toast("부모님께 퀘스트 완료 보고서와 알림을 보냈어요! ⏳");
};

window.reviewReport = async (reportId, status) => {
  const report = State.reports.find(r => r.id === reportId);

  await updateDoc(doc(db, "reports", reportId), {
    status,
    reviewedAt: Date.now()
  });

  if (report) {
    // 자녀에게 승인/반려 처리 알림 전송
    await addDoc(collection(db, "notifications"), {
      targetId: report.childId,
      senderName: State.me.name,
      type: "report_reviewed",
      title: status === "approved" ? "🎉 퀘스트 승인 완료!" : "😅 퀘스트 검토 결과",
      message: status === "approved" 
        ? `"${report.title}" 퀘스트가 승인되어 ${won(report.reward)}의 보상이 쌓였어요!` 
        : `"${report.title}" 퀘스트가 반려되었어요. 다시 확인해 보세요.`,
      ts: Date.now(),
      read: false
    });
  }

  if (status === "approved") {
    triggerConfetti();
    toast("퀘스트 완료를 승인했습니다! 보상이 지급되었습니다. 💰");
  } else {
    toast("퀘스트 완료 보고를 반려하였습니다.");
  }
};

window.recordPayout = async (childId) => {
  const currentBal = getBalance(childId);
  if (currentBal <= 0) {
    toast("지급할 남아있는 용돈 잔액이 없습니다.");
    return;
  }

  const inputVal = prompt(`지급할 용돈 금액을 입력하세요 (현재 미지급 잔액: ${won(currentBal)})`, currentBal);
  if (!inputVal) return;
  const amount = parseInt(inputVal, 10);

  if (isNaN(amount) || amount <= 0 || amount > currentBal) {
    toast("올바른 금액을 입력해주세요. (현재 잔액 이하)");
    return;
  }

  await addDoc(collection(db, "payouts"), {
    parentId: State.me.uid,
    childId,
    amount,
    ts: Date.now()
  });

  toast("용돈 지급 완료 기록을 저장했습니다! 🎉");
};

      <div class="card">
        <h3>🔗 자녀 연동 초대 코드</h3>
        <p class="text-muted" style="margin-top:-4px;">자녀가 로그인 후 아래 코드를 입력하면 자동 연동됩니다.</p>
        <div class="invite-code-box">${esc(State.me.code || 'CODE')}</div>
      </div>

      <h3 style="margin:16px 4px 8px;">🧒 연동된 자녀 목록 (${State.kids.length})</h3>
    `;

    if (State.kids.length === 0) {
      body += `<div class="card empty-state">아직 연동된 자녀가 없습니다.</div>`;
    } else {
      body += State.kids.map(k => {
        const lv = getLevelInfo(k.id);
        const bal = getBalance(k.id);
        return `
          <div class="card">
            <div class="row">
              <div>
                <h3 style="font-size:20px;">🧒 ${esc(k.name)}</h3>
                <div class="text-muted">${esc(k.email || k.phone || '계정 정보 없음')}</div>
              </div>
              <div style="text-align:right;">
                <div class="amount-won" style="font-size:22px;">${won(bal)}</div>
              </div>
            </div>

            <div class="row" style="margin-top:10px;">
              <button class="btn-yellow fit" style="font-size:13px;" onclick="sendDirectNotification('${k.id}')">📲 콕! 찌르기 알림 보내기</button>
              <button class="btn-mint" onclick="recordPayout('${k.id}')">💵 용돈 지급</button>
            </div>
          </div>
        `;
      }).join("");
    }
  }

  // TAB: Stats & Activity History
  if (State.tab === "stats") {
    body += `<h3 style="margin:12px 4px;">📊 전체 활동 및 용돈 지급 내역</h3>`;
    const approvedReports = State.reports.filter(r => r.status === "approved");
    
    body += `
      <div class="card">
        <h3>💰 용돈 지급 내역 (${State.payouts.length}건)</h3>
        ${State.payouts.length === 0 ? '<p class="text-muted">지급 완료 내역이 아직 없습니다.</p>' : 
          State.payouts.map(p => `
            <div class="row" style="padding:8px 0; border-bottom:1px solid #eee;">
              <div>
                <div><b>${esc(getChildName(p.childId))}</b> 용돈 지급</div>
                <div class="text-muted" style="font-size:11px;">${new Date(p.ts).toLocaleString()}</div>
              </div>
              <div class="amount-won fit" style="color:#27AE60;">-${won(p.amount)}</div>
            </div>
          `).join("")
        }
      </div>

      <div class="card">
        <h3>📜 승인 완료된 퀘스트 내역 (${approvedReports.length}건)</h3>
        ${approvedReports.length === 0 ? '<p class="text-muted">승인된 내역이 없습니다.</p>' : 
          approvedReports.map(r => `
            <div class="row" style="padding:8px 0; border-bottom:1px solid #eee;">
              <div>
                <div>${esc(r.icon)} <b>${esc(r.title)}</b> (${esc(r.childName)})</div>
                <div class="text-muted" style="font-size:11px;">${new Date(r.ts).toLocaleString()}</div>
              </div>
              <div class="amount-won fit">+${won(r.reward)}</div>
            </div>
          `).join("")
        }
      </div>
    `;
  }

  const nav = `
    <nav class="tabs">
      <button class="${State.tab === 'home' ? 'on' : ''}" onclick="setTab('home')">
        <span class="icon">✅</span>승인 대기 ${pendingReports.length ? `<span class="badge">${pendingReports.length}</span>` : ''}
      </button>
      <button class="${State.tab === 'quests' ? 'on' : ''}" onclick="setTab('quests')">
        <span class="icon">📋</span>퀘스트 관리
      </button>
      <button class="${State.tab === 'kids' ? 'on' : ''}" onclick="setTab('kids')">
        <span class="icon">🧒</span>자녀 목록
      </button>
      <button class="${State.tab === 'stats' ? 'on' : ''}" onclick="setTab('stats')">
        <span class="icon">📊</span>리포트
      </button>
    </nav>
  `;

  return body + nav + `<div style="text-align:center; margin-top:20px;"><button class="link-btn" onclick="logout()">로그아웃</button></div>`;
}

// 5. Child View Content
function renderChildView() {
  const myId = State.me.uid;
  const lv = getLevelInfo(myId);
  const myBalance = getBalance(myId);

  // Filter available quests
  const availableQuests = State.quests.filter(q => {
    if (q.childId !== "all" && q.childId !== myId) return false;
    const myReports = State.reports.filter(r => r.questId === q.id && r.status !== "rejected");
    if (q.repeat === "once") return myReports.length === 0;
    // Daily repeat
    return !myReports.some(r => new Date(r.ts).toDateString() === todayStr());
  });

  let body = `
    <div class="card card-hero">
      <div class="row">
        <div style="text-align:left;">
          <h2>🧒 ${esc(State.me.name)}</h2>
          <div style="font-size:14px; font-weight:bold; color:var(--primary-ink);">${lv.title} (Lv.${lv.lv})</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px; color:var(--primary-ink); font-weight:500;">보유 중인 용돈</div>
          <div class="amount-won" style="font-size:26px; color:var(--primary-ink);">💰 ${won(myBalance)}</div>
        </div>
      </div>
      <div class="progress-bar" style="margin-top:12px;" title="다음 레벨까지">
        <i style="width:${lv.progress}%"></i>
      </div>
      <div style="font-size:12px; margin-top:4px; text-align:right; font-weight:500;">성공한 퀘스트: ${lv.count}개</div>
    </div>
  `;

  // TAB: Perform Quests (Child View)
  if (State.tab === "home") {
    const unreadNotifs = State.notifications.filter(n => !n.read);

    body += `
      ${unreadNotifs.length > 0 ? `
        <div class="card" style="background:#FFF9E6; border-color:#F39C12;">
          <h3 style="color:#D35400;">🔔 부모님으로부터 온 알림 (${unreadNotifs.length})</h3>
          ${unreadNotifs.map(n => `
            <div style="padding:8px 0; border-bottom:1px dashed #F39C12;" class="row">
              <div style="flex:1;">
                <b>${esc(n.title)}</b>
                <div style="font-size:13px; margin-top:2px;">${esc(n.message)}</div>
                <div class="text-muted" style="font-size:11px;">${new Date(n.ts).toLocaleTimeString()}</div>
              </div>
              <button class="btn-ghost fit" style="font-size:12px; padding:4px 8px;" onclick="markNotificationRead('${n.id}')">확인 완료</button>
            </div>
          `).join("")}
        </div>
      ` : ''}

      <h3 style="margin:12px 4px;">⚔️ 오늘 수행 가능한 퀘스트 (${availableQuests.length})</h3>
    `;

    if (availableQuests.length === 0) {
      body += `<div class="card empty-state">🎉 오늘 할 수 있는 퀘스트를 모두 마쳤거나 등록된 퀘스트가 없습니다!</div>`;
    } else {
      body += availableQuests.map(q => `
        <div class="card quest-item">
          <div class="quest-icon">${esc(q.icon)}</div>
          <div style="flex:1;">
            <div class="quest-title">${esc(q.title)}</div>
            ${q.dueTime ? `<div style="font-size:12px; font-weight:bold; color:#E67E22; margin-top:2px;">⏰ 마감/수행 시간: ${esc(q.dueTime)}</div>` : ''}
            <div class="amount-won">+${won(q.reward)}</div>
          </div>
          <button class="btn-mint fit" onclick="submitQuestReport('${q.id}')">했어요! 🖐️</button>
        </div>
      `).join("");
    }
  }

  // TAB: Activity Log
  if (State.tab === "log") {
    body += `<h3 style="margin:12px 4px;">📜 내 퀘스트 제출 기록</h3>`;
    if (State.reports.length === 0) {
      body += `<div class="card empty-state">아직 제출한 퀘스트가 없습니다.</div>`;
    } else {
      body += State.reports.map(r => {
        const pillClass = r.status === 'pending' ? 'pill-pending' : r.status === 'approved' ? 'pill-approved' : 'pill-rejected';
        const pillLabel = r.status === 'pending' ? '검토중 ⏳' : r.status === 'approved' ? '승인됨 ✨' : '반려됨 😅';
        return `
          <div class="card quest-item">
            <div class="quest-icon">${esc(r.icon)}</div>
            <div style="flex:1;">
              <div class="quest-title">${esc(r.title)}</div>
              <div class="text-muted">${new Date(r.ts).toLocaleDateString()} · +${won(r.reward)}</div>
            </div>
            <span class="pill ${pillClass}">${pillLabel}</span>
          </div>
        `;
      }).join("");
    }

    if (State.payouts.length > 0) {
      body += `<h3 style="margin:16px 4px 8px;">💵 부모님께 받은 용돈 기록</h3>`;
      body += State.payouts.map(p => `
        <div class="card row">
          <div>
            <div><b>용돈 받음! 🎉</b></div>
            <div class="text-muted" style="font-size:12px;">${new Date(p.ts).toLocaleDateString()}</div>
          </div>
          <div class="amount-won fit" style="font-size:20px; color:#27AE60;">+${won(p.amount)}</div>
        </div>
      `).join("");
    }
  }

  // TAB: Parent Connection Info & Profile
  if (State.tab === "parent_info") {
    body += `
      <div class="card">
        <h3>👨‍👩‍👧 연동된 부모님 정보</h3>
        <div style="margin:12px 0; line-height:1.6;">
          <div><b>성함:</b> ${esc(State.me.parentName || '부모님')}</div>
          <div><b>이메일:</b> ${esc(State.me.parentEmail || '정보 없음')}</div>
          <div><b>연락처:</b> ${esc(State.me.parentPhone || '정보 없음')}</div>
        </div>
        <button class="btn-pink" style="width:100%; font-size:14px;" onclick="unlinkParent()">부모님 연동 해제하기</button>
      </div>

      <div class="card">
        <h3>👤 내 프로필 정보</h3>
        <div style="margin:12px 0; line-height:1.6;">
          <div><b>이름:</b> ${esc(State.me.name)}</div>
          <div><b>이메일/아이디:</b> ${esc(State.me.email)}</div>
          <div><b>내 연락처:</b> ${esc(State.me.phone || '미등록')}</div>
        </div>
        <button class="btn-ghost" style="width:100%; font-size:14px;" onclick="openEditProfileModal()">프로필 수정</button>
      </div>
    `;
  }

  const nav = `
    <nav class="tabs">
      <button class="${State.tab === 'home' ? 'on' : ''}" onclick="setTab('home')">
        <span class="icon">⚔️</span>퀘스트
      </button>
      <button class="${State.tab === 'log' ? 'on' : ''}" onclick="setTab('log')">
        <span class="icon">📜</span>활동기록
      </button>
      <button class="${State.tab === 'parent_info' ? 'on' : ''}" onclick="setTab('parent_info')">
        <span class="icon">👨‍👩‍👧</span>부모연동
      </button>
    </nav>
  `;

  return body + nav + `<div style="text-align:center; margin-top:20px;"><button class="link-btn" onclick="logout()">로그아웃</button></div>`;
}

// 6. Modal Renderer
function renderModal() {
  if (!State.modal) return "";

  if (State.modal === "edit_profile") {
    return `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
          <h3 style="margin-bottom:12px;">⚙️ 프로필 정보 수정</h3>
          <label style="font-size:13px; font-weight:bold;">이름 / 닉네임</label>
          <input id="mod-name" value="${esc(State.me.name || '')}" placeholder="이름을 입력하세요">
          
          <label style="font-size:13px; font-weight:bold;">연락처 (선택)</label>
          <input id="mod-phone" type="tel" value="${esc(State.me.phone || '')}" placeholder="010-0000-0000">

          <div class="row" style="margin-top:14px;">
            <button class="btn-ghost" onclick="closeModal()">취소</button>
            <button class="btn-mint" onclick="updateProfile()">저장하기</button>
          </div>
        </div>
      </div>
    `;
  }
  return "";
}

// Main Render Dispatcher
function render() {
  const app = $("#app");
  if (!app) return;

  let content = "";
  if (State.authMode === "setup_profile") {
    content = renderProfileSetupView();
  } else if (!State.me) {
    content = renderAuthView();
  } else if (State.me.role === "parent") {
    content = renderParentView();
  } else {
    content = State.me.parentId ? renderChildView() : renderChildConnectView();
  }

  app.innerHTML = content + renderModal();
}

// Initial Call
render();
</script>
</body>
</html>
